# Intégration continue — Pressing Pro
#
# Objectif : aucun commit ne peut être fusionné dans `main` si les types, le
# style, les tests ou le build échouent.
#
# Choix techniques :
#  - `npm ci` (et non `npm install`) : installation strictement conforme à
#    `package-lock.json`, reproductible, et échec immédiat si le verrou est
#    désynchronisé de `package.json` ;
#  - Node 22 : même version majeure que le poste de développement ;
#  - trois jobs : l'application (types, style, tests, build), le SQL réel
#    (migrations, RLS, rôles, verrou optimiste) sur un PostgreSQL 16 jetable,
#    et les parcours navigateur (Playwright, mode démonstration) ;
#    le job SQL n'a besoin ni de Supabase ni de Docker : le fichier
#    `supabase/tests/local/00_bootstrap.sql` recrée l'environnement Supabase
#    minimal (rôles, schéma `auth`, `auth.uid()`) ;
#  - le job navigateur ne rejoue que les projets `demo` et `demo-mobile` : ils
#    démarrent Vite avec un projet Supabase volontairement vide, donc sans
#    secret ni accès réseau. Le projet `reel` (vrai Supabase, variables
#    `E2E_BASE_URL`/`E2E_EMAIL`/`E2E_PASSWORD`) reste hors CI : il exige des
#    secrets et une base de recette, et il est explicitement ignoré sinon ;
#  - `concurrency` : une nouvelle poussée annule la vérification précédente de
#    la même branche, inutile dès qu'elle est obsolète.
#
# ⚠ Ce workflow ne remplace pas la recette sur un vrai projet Supabase
#   (provisionnement, Edge Functions, webhook CinetPay) : elle est décrite dans
#   docs/AUDIT-COURANT.md §6 et reste manuelle.

name: Intégration continue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Types, style, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Vérifier le style
        run: npm run lint

      - name: Exécuter les tests
        run: npm test

      - name: Construire l'application
        run: npm run build

  bout_en_bout:
    name: Parcours navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le navigateur n'est pas dans `node_modules` : on le télécharge une fois
      # et on le garde tant que `package-lock.json` ne change pas.
      - name: Mettre en cache le Chromium de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium

      - name: Vérifier les types des scénarios
        run: npm run typecheck:e2e

      # Le serveur Vite des scénarios (port 3100) est démarré par Playwright
      # lui-même : `webServer` dans playwright.config.ts.
      - name: Rejouer les parcours en mode démonstration
        run: npm run e2e:demo

      - name: Publier le rapport et les traces si un scénario échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  sql:
    name: SQL réel (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rejouer migrations, RLS, rôles et verrou optimiste
        run: npm run sql:verify
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
