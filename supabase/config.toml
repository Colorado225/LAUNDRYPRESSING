# =============================================================================
# Configuration Supabase CLI — Pressing Pro
# =============================================================================
# Utilisée par `supabase start` (environnement local) et `supabase functions
# deploy`. Les secrets des Edge Functions ne sont PAS ici : ils se configurent
# avec `supabase secrets set ...` (ou via le dashboard).
# =============================================================================

project_id = "pressing-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

# --- Edge Functions ----------------------------------------------------------
# `cinetpay-init` : appelée par le navigateur, le JWT Supabase est exigé.
[functions.cinetpay-init]
verify_jwt = true

# `cinetpay-webhook` : appelée par CinetPay, qui ne peut pas fournir de JWT.
# La sécurité repose sur la signature HMAC + l'API de vérification CinetPay.
[functions.cinetpay-webhook]
verify_jwt = false
